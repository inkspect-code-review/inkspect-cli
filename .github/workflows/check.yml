name: Portable CLI checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -buildvcs=false ./cmd/inkspect
      - name: Native executable smoke test
        shell: bash
        run: ./inkspect --version
  archives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - run: go run scripts/build.go
      - uses: actions/upload-artifact@v4
        with:
          name: inkspect-release-candidates
          path: dist/
